<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title, webbläsarflik, unik för varje sida -->
    <title>Pedalen cykelverkstad i Stockholm</title>
    <meta
        name="description"
        content="Pedalen lagar och servar alla sorters cyklar i Stockholm. Boka service eller se våra priser."
    >
    <!-- Favicon, logga exempelvis, syns i fliken -->
    <link
        rel="shortcut icon"
        href="images/favicon.svg"
        type="image/x-icon"
    >
</head>
<body>
    <!-- Hoppa över länl, det är det första som får fokus när man trycker Tab, låt besökaren hoppa över meny -->
    <a href="#innehall" class="skip">Hoppa till innehållet</a>
    <header class="header">
        <div class="container header_inner">
            <a href="index.html" class="logo">Pedalen</a>
            <!-- Aria-label, förklarar för skärmläsaren vad menyn heter -->
            <nav aria-label="Huvudmeny">
                <!-- Menyn är en lista, skärmläsaren säger "Lista med xxx punkter" -->
                 <ul class="nav">
                    <li><a href="#tjanster">Tjänster</a></li>
                    <li><a href="#priser">Priser</a></li>
                    <li><a href="#oppeter">Öppetider</a></li>
                    <li><a href="#kontakt">Kontakt</a></li>
                 </ul>
            </nav>
        </div>
    </header>
    <!-- Låter hoppa över och gå direkt till main genom länken "innehåll" -->
    <main id="innehall">
        <!-- 1. Section Hero -->
        <section class="hero-on-dark">
            <div class="container hero-inner">
                <p class="eyebrow">cykelverkstad i Stockholm</p>
                <h1>Servad och redo för nästa åktur</h1>
                <p class="lead">
                    Landsväg, stad eller singletrack. Vi lagar, servar och trimmar alla sorters cyklar. Lämna in på morgonen, hämta på eftermiddagen.
                </p>
                <p class="actions">
                    <a class="btn btn--primary" href="#kontakt">Boka service</a>
                    <a class="btn btn--ghost" href="#kontakt">Boka service</a>
                </p>
            </div>
            <!-- figure och figcaption, en bild med bildtext som hör ihop -->
            <figure class="hero_media">
                <img
                    src="images/hero.jpg"
                    alt="Mountainbikecyclist i luften mellan höga granar, med solen bakom trädtopparna"
                    width="960"
                    height="1440"
                >
                <figcaption class="badge">Grundservice klar samma dag</figcaption>
            </figure>
        </section>
        
    </main>
</body>
</html>
